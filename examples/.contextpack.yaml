max_file_size_kb: 128
token_budget: 50000
include_hidden_files: false
include_tests: true
include_docs: true
include_config: true
redact_secrets: true
output_file: CONTEXT.md

ignore_dirs:
  - .git
  - .venv
  - node_modules
  - dist
  - build
  - __pycache__

ignore_files:
  - package-lock.json
  - poetry.lock

include_extensions: []
exclude_extensions:
  - .log
